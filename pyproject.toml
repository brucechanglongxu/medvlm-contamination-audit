[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medvlm-contam"
version = "0.0.1"
description = "Contamination audit of open medical VLMs against public multimodal medical benchmarks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "medvlm-contam contributors" }]
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hf = [
    "torch>=2.2",
    "transformers>=4.45",
    "accelerate>=0.33",
    "Pillow>=10.0",
    "datasets>=2.20",
]
embed = [
    "open_clip_torch>=2.24",
    "faiss-cpu>=1.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
medvlm-audit = "medvlm_contam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
